<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crear cuenta | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><section class="card shadow-sm mx-auto" style="max-width:560px"><div class="card-body p-4"><h1 class="h3 text-center mb-4">Crear cuenta</h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/registro}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Usuario</label><input class="form-control" name="username" required maxlength="30"></div><div class="col-md-6"><label class="form-label">Correo</label><input class="form-control" name="correo" type="email" required maxlength="75"></div><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" required maxlength="20"></div><div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" name="apellidos" required maxlength="30"></div><div class="col-12"><label class="form-label">Contraseña</label><input class="form-control" name="password" type="password" minlength="3" required></div></div><button class="btn btn-primary w-100 mt-4" type="submit">Registrarme</button></form><a class="d-block text-center mt-3" th:href="@{/login}">Ya tengo cuenta</a></div></section></main></body></html>
