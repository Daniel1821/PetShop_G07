<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Recuperar contraseña | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><section class="card shadow-sm mx-auto" style="max-width:460px"><div class="card-body p-4"><h1 class="h3 text-center mb-3">Restablecer contraseña</h1><p class="text-secondary small">Ingresa el correo registrado y define una contraseña nueva.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/recuperar-contrasena}" method="post"><label class="form-label">Correo</label><input class="form-control mb-3" name="correo" type="email" required><label class="form-label">Nueva contraseña</label><input class="form-control" name="password" type="password" minlength="3" required><button class="btn btn-primary w-100 mt-4" type="submit">Actualizar contraseña</button></form><a class="d-block text-center mt-3" th:href="@{/login}">Volver a inicio de sesión</a></div></section></main></body></html>
