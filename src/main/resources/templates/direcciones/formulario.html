<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dirección | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card shadow-sm border-0 mx-auto" style="max-width:720px"><div class="card-body p-4"><h1 class="h3 mb-4" th:text="${direccion.idDireccion == null ? 'Nueva dirección' : 'Editar dirección'}">Dirección</h1><form th:action="@{/direcciones/guardar}" th:object="${direccion}" method="post"><input type="hidden" th:field="*{idDireccion}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Provincia</label><input class="form-control" th:field="*{provincia}" required maxlength="30"></div><div class="col-md-4"><label class="form-label">Cantón</label><input class="form-control" th:field="*{canton}" required maxlength="30"></div><div class="col-md-4"><label class="form-label">Distrito</label><input class="form-control" th:field="*{distrito}" required maxlength="30"></div><div class="col-12"><label class="form-label">Señas</label><textarea class="form-control" th:field="*{senas}" required maxlength="255"></textarea></div><div class="col-md-8"><label class="form-label">Teléfono de contacto</label><input class="form-control" th:field="*{telefonoContacto}" maxlength="25"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{predeterminada}"><label class="form-check-label">Predeterminada</label></div></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/direcciones}">Cancelar</a></div></form></div></div></main></body></html>
