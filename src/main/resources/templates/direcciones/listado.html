<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Mis direcciones | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" th:href="@{/}">PetShop</a><a class="btn btn-light btn-sm" th:href="@{/carrito}">Mi carrito</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between mb-4"><h1>Mis direcciones</h1><a class="btn btn-primary" th:href="@{/direcciones/nueva}">Nueva dirección</a></div><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${#lists.isEmpty(direcciones)}" class="alert alert-info">No tienes direcciones registradas.</div><div class="row g-3"><div class="col-md-6" th:each="direccion : ${direcciones}"><div class="card h-100 shadow-sm"><div class="card-body"><span th:if="${direccion.predeterminada}" class="badge text-bg-primary float-end">Predeterminada</span><h2 class="h5" th:text="|${direccion.provincia}, ${direccion.canton}|">Provincia</h2><p class="mb-1" th:text="${direccion.distrito}">Distrito</p><p class="text-secondary" th:text="${direccion.senas}">Señas</p><p th:if="${direccion.telefonoContacto}" th:text="${direccion.telefonoContacto}">Teléfono</p><div class="d-flex gap-2"><a class="btn btn-outline-primary btn-sm" th:href="@{/direcciones/{id}/editar(id=${direccion.idDireccion})}">Editar</a><form th:action="@{/direcciones/{id}/eliminar(id=${direccion.idDireccion})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button></form></div></div></div></div></div></main></body></html>
