<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">🐾 PetShop</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/categorias}">Categorías</a><a class="btn btn-light btn-sm" th:href="@{/catalogo}">Catálogo</a></div></div></nav>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="fw-bold mb-1">Productos</h1><p class="text-secondary mb-0">Administra el catálogo y controla las existencias.</p></div><a th:href="@{/productos/nuevo}" class="btn btn-primary">+ Agregar producto</a></div>
        <div th:if="${!#lists.isEmpty(productosStockBajo)}" class="alert alert-warning shadow-sm"><strong>Stock bajo:</strong> <span th:each="producto, estado : ${productosStockBajo}" th:text="|${producto.descripcion} (${producto.existencias})${estado.last ? '' : ', '}|"></span></div>
        <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3">ID</th><th>Producto</th><th>Precio</th><th>Existencias</th><th>Estado</th><th class="text-end pe-3">Acciones</th></tr></thead><tbody>
            <tr th:each="producto : ${productos}"><td class="ps-3" th:text="${producto.idProducto}">1</td><td class="fw-semibold" th:text="${producto.descripcion}">Producto</td><td th:text="|₡${#numbers.formatDecimal(producto.precio,1,2)}|">₡0</td><td><span class="badge" th:classappend="${producto.existencias <= 5 ? ' text-bg-warning' : ' text-bg-success'}" th:text="${producto.existencias}">0</span></td><td><span class="badge" th:classappend="${producto.activo ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${producto.activo ? 'Activo' : 'Inactivo'}">Activo</span></td><td class="text-end pe-3"><a th:href="@{/productos/modificar/{id}(id=${producto.idProducto})}" class="btn btn-outline-primary btn-sm">Editar</a><a th:href="@{/productos/eliminar/{id}(id=${producto.idProducto})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Desea eliminar este producto?');">Eliminar</a></td></tr>
        </tbody></table></div></div>
    </main>
</body>
</html>
