<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Comprobante | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card shadow-sm border-0 mx-auto" style="max-width:800px"><div class="card-body p-4"><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div class="d-flex justify-content-between"><div><h1 class="h2">Comprobante de compra</h1><p class="text-secondary" th:text="|Pedido #${pedido.idPedido}|">Pedido</p></div><span class="badge text-bg-primary align-self-start" th:text="${pedido.estado}">Pendiente</span></div><p th:text="|Fecha: ${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}|">Fecha</p><p th:text="|Entrega: ${pedido.direccion.provincia}, ${pedido.direccion.canton}, ${pedido.direccion.distrito} - ${pedido.direccion.senas}|">Dirección</p><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody><tr th:each="detalle : ${pedido.detalles}"><td th:text="${detalle.producto.descripcion}">Producto</td><td th:text="${detalle.cantidad}">1</td><td th:text="|₡${#numbers.formatDecimal(detalle.precioHistorico,1,2)}|">₡0</td><td th:text="|₡${#numbers.formatDecimal(detalle.precioHistorico * detalle.cantidad,1,2)}|">₡0</td></tr></tbody></table><h2 class="h4 text-end" th:text="|Total: ₡${#numbers.formatDecimal(pedido.total,1,2)}|">Total</h2><div class="text-end mt-4"><a class="btn btn-primary" th:href="@{/pedidos}">Mis pedidos</a></div></div></div></main></body></html>
