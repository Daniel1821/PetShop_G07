<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestión de pedidos | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><a class="btn btn-light btn-sm" th:href="@{/productos}">Administración</a></div></nav><main class="container py-5"><h1 class="fw-bold mb-4">Gestión de pedidos</h1><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-info">No hay pedidos registrados.</div><div th:unless="${#lists.isEmpty(pedidos)}" class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th class="ps-3">Pedido</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td class="ps-3" th:text="|#${pedido.idPedido}|">#1</td><td th:text="|${pedido.usuario.nombre} ${pedido.usuario.apellidos}|">Cliente</td><td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td><td th:text="|₡${#numbers.formatDecimal(pedido.total, 1, 2)}|">₡0</td><td><form class="d-flex gap-2" th:action="@{/pedidos/gestion/{id}/estado(id=${pedido.idPedido})}" method="post"><select class="form-select form-select-sm" name="estado"><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${estado == pedido.estado}">Pendiente</option></select><button class="btn btn-primary btn-sm" type="submit">Guardar</button></form></td></tr></tbody></table></div></div></main></body>
</html>
