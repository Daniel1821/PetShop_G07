<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mis pedidos | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Mi carrito</a><a class="btn btn-light btn-sm" th:href="@{/catalogo}">Catálogo</a></div></div></nav><main class="container py-5"><h1 class="fw-bold mb-4">Mis pedidos</h1><div th:if="${#lists.isEmpty(pedidos)}" class="card border-0 shadow-sm"><div class="card-body text-center py-5"><p class="lead mb-3">Aún no tienes compras registradas.</p><a class="btn btn-primary" th:href="@{/catalogo}">Explorar catálogo</a></div></div><div th:unless="${#lists.isEmpty(pedidos)}" class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th class="ps-3">Pedido</th><th>Fecha</th><th>Estado</th><th class="text-end pe-3">Total</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td class="ps-3" th:text="|#${pedido.idPedido}|">#1</td><td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td><td><span class="badge text-bg-primary" th:text="${pedido.estado}">Pendiente</span></td><td class="text-end pe-3 fw-semibold" th:text="|₡${#numbers.formatDecimal(pedido.total, 1, 2)}|">₡0</td></tr></tbody></table></div></div></main></body>
</html>
