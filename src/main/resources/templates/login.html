<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="card shadow-sm mx-auto" style="max-width: 420px;">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4">PetShop</h1>
                <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña inválidos.</div>
                <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente.</div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <input class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
                </form>
                <a class="d-block text-center mt-3" th:href="@{/}">Volver al inicio</a>
            </div>
        </section>
    </main>
</body>
</html>
