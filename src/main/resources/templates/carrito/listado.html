<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Carrito | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><a class="btn btn-light btn-sm" th:href="@{/catalogo}">Seguir comprando</a></div></nav><main class="container py-5"><h1 class="fw-bold mb-4">Mi carrito</h1><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${#lists.isEmpty(detalles)}" class="card border-0 shadow-sm"><div class="card-body text-center py-5"><p class="lead mb-3">Tu carrito está vacío.</p><a class="btn btn-primary" th:href="@{/catalogo}">Ver catálogo</a></div></div><div th:unless="${#lists.isEmpty(detalles)}" class="row g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th class="ps-3">Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody><tr th:each="detalle : ${detalles}"><td class="ps-3" th:text="${detalle.producto.descripcion}">Producto</td><td th:text="|₡${#numbers.formatDecimal(detalle.producto.precio, 1, 2)}|">₡0</td><td><form class="d-flex gap-2" th:action="@{/carrito/{id}/cantidad(id=${detalle.idCarritoDetalle})}" method="post"><input class="form-control" style="width:80px" type="number" name="cantidad" min="1" th:max="${detalle.producto.existencias}" th:value="${detalle.cantidad}"><button class="btn btn-outline-primary btn-sm" type="submit">Actualizar</button></form></td><td class="fw-semibold" th:text="|₡${#numbers.formatDecimal(detalle.producto.precio * detalle.cantidad, 1, 2)}|">₡0</td><td class="pe-3"><form th:action="@{/carrito/{id}/eliminar(id=${detalle.idCarritoDetalle})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button></form></td></tr></tbody></table></div></div></div><aside class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h4">Resumen</h2><div class="d-flex justify-content-between border-top pt-3 mt-3"><span class="fw-bold">Total</span><strong class="fs-4 text-primary" th:text="|₡${#numbers.formatDecimal(total, 1, 2)}|">₡0</strong></div><form th:action="@{/carrito/finalizar}" method="post"><button class="btn btn-primary w-100 mt-4" type="submit">Finalizar compra</button></form></div></div></aside></div></main></body>
</html>
