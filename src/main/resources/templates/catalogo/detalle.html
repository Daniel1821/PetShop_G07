<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Producto | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Mi carrito</a><a class="btn btn-light btn-sm" th:href="@{/catalogo}">Volver al catálogo</a></div></div></nav>
    <main class="container py-5"><article class="card border-0 shadow-sm overflow-hidden"><div class="row g-0"><div class="col-md-6"><img th:src="${producto.rutaImagen}" th:alt="${producto.descripcion}" class="w-100 h-100 object-fit-cover" style="min-height: 360px" onerror="this.src='https://placehold.co/900x700?text=PetShop'"></div><div class="col-md-6"><div class="card-body p-4 p-lg-5"><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><h1 class="display-6 fw-bold" th:text="${producto.descripcion}">Producto</h1><p class="lead text-secondary" th:text="${producto.detalle}">Detalle</p><p class="fs-3 fw-bold text-primary" th:text="|₡${#numbers.formatDecimal(producto.precio, 1, 2)}|">₡0</p><p class="text-secondary" th:text="|Disponibilidad: ${producto.existencias} unidades|">Disponibilidad</p><form th:if="${producto.existencias > 0}" th:action="@{/carrito/agregar}" method="post" class="d-flex gap-2 align-items-end"><input type="hidden" name="idProducto" th:value="${producto.idProducto}"><div><label class="form-label" for="cantidad">Cantidad</label><input id="cantidad" class="form-control" type="number" name="cantidad" min="1" th:max="${producto.existencias}" value="1"></div><button class="btn btn-primary btn-lg" type="submit">Agregar al carrito</button></form><p th:unless="${producto.existencias > 0}" class="text-danger fw-semibold">Producto agotado</p></div></div></div></article></main>
</body>
</html>
