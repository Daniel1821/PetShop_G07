<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><a class="btn btn-light btn-sm" th:href="@{/login}">Mi cuenta</a></div></nav>
    <main class="container py-5">
        <div class="text-center mb-5"><h1 class="fw-bold">Catálogo</h1><p class="text-secondary mb-0">Encuentra lo que tu mascota necesita.</p></div>
        <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info text-center">No hay productos disponibles por el momento.</div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="producto : ${productos}">
                <article class="card h-100 shadow-sm border-0">
                    <img th:src="${producto.rutaImagen}" th:alt="${producto.descripcion}" class="card-img-top object-fit-cover" style="height: 220px" onerror="this.src='https://placehold.co/600x400?text=PetShop'">
                    <div class="card-body d-flex flex-column">
                        <h2 class="h5 card-title" th:text="${producto.descripcion}">Producto</h2>
                        <p class="card-text text-secondary small flex-grow-1" th:text="${producto.detalle}">Detalle</p>
                        <div class="d-flex justify-content-between align-items-center"><strong class="fs-5 text-primary" th:text="|₡${#numbers.formatDecimal(producto.precio, 1, 2)}|">₡0</strong><a class="btn btn-primary" th:href="@{/catalogo/{id}(id=${producto.idProducto})}">Ver detalle</a></div>
                    </div>
                </article>
            </div>
        </div>
    </main>
</body>
</html>
