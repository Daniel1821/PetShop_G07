<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">PetShop</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" th:href="@{/catalogo(lang='es')}">ES</a><a class="btn btn-outline-light btn-sm" th:href="@{/catalogo(lang='en')}">EN</a><a th:if="${esAdmin}" class="btn btn-warning btn-sm" th:href="@{/pedidos/gestion}">Gestión de pedidos</a><a class="btn btn-outline-light btn-sm" th:href="@{/pedidos}">Mis pedidos</a><a class="btn btn-outline-light btn-sm" th:href="@{/carrito}">Mi carrito</a><a class="btn btn-light btn-sm" th:href="@{/login}">Mi cuenta</a></div></div></nav>
    <main class="container py-5">
        <div class="text-center mb-4"><h1 class="fw-bold" th:text="#{catalog.title}">Catálogo</h1><p class="text-secondary mb-0" th:text="#{catalog.subtitle}">Encuentra lo que tu mascota necesita.</p></div>
        <form class="card border-0 shadow-sm mb-4" th:action="@{/catalogo}" method="get"><div class="card-body row g-3 align-items-end"><div class="col-md-6"><label class="form-label" for="busqueda" th:text="#{catalog.search}">Buscar producto</label><input id="busqueda" class="form-control" name="busqueda" maxlength="50" th:value="${busqueda}" placeholder="Ej. croquetas, juguete..."></div><div class="col-md-4"><label class="form-label" for="categoria" th:text="#{catalog.category}">Categoría</label><select id="categoria" class="form-select" name="categoria" onchange="this.form.submit()"><option value="" th:text="#{catalog.allCategories}">Todas las categorías</option><option th:each="item : ${categorias}" th:value="${item.idCategoria}" th:text="${item.descripcion}" th:selected="${item.idCategoria == categoriaSeleccionada}">Categoría</option></select></div><div class="col-md-2 d-flex gap-2"><button class="btn btn-primary flex-grow-1" type="submit" th:text="#{catalog.searchButton}">Buscar</button><a class="btn btn-outline-secondary" th:href="@{/catalogo}" th:text="#{catalog.clear}">Limpiar</a></div></div></form>
        <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info text-center">No se encontraron productos con los filtros seleccionados.</div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"><div class="col" th:each="producto : ${productos}"><article class="card h-100 shadow-sm border-0"><img th:src="${producto.rutaImagen}" th:alt="${producto.descripcion}" class="card-img-top object-fit-cover" style="height: 220px" onerror="this.src='https://placehold.co/600x400?text=PetShop'"><div class="card-body d-flex flex-column"><h2 class="h5 card-title" th:text="${producto.descripcion}">Producto</h2><p class="card-text text-secondary small flex-grow-1" th:text="${producto.detalle}">Detalle</p><div class="d-flex justify-content-between align-items-center"><strong class="fs-5 text-primary" th:text="|₡${#numbers.formatDecimal(producto.precio, 1, 2)}|">₡0</strong><a class="btn btn-primary" th:href="@{/catalogo/{id}(id=${producto.idProducto})}">Ver detalle</a></div></div></article></div></div>
    </main>
</body>
</html>
