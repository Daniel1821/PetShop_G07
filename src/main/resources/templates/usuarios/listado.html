<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">🐾 PetShop</a><a class="btn btn-light btn-sm" th:href="@{/catalogo}">Catálogo</a></div></nav>
    <main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="fw-bold mb-1">Usuarios</h1><p class="text-secondary mb-0">Administra las cuentas registradas en el sistema.</p></div><a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Agregar usuario</a></div>
        <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3">ID</th><th>Usuario</th><th>Nombre completo</th><th>Correo</th><th>Estado</th><th class="text-end pe-3">Acciones</th></tr></thead><tbody><tr th:each="usuario : ${usuarios}"><td class="ps-3" th:text="${usuario.idUsuario}">1</td><td class="fw-semibold" th:text="${usuario.username}">usuario</td><td th:text="|${usuario.nombre} ${usuario.apellidos}|">Nombre</td><td th:text="${usuario.correo}">correo</td><td><span class="badge" th:classappend="${usuario.activo ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Activo</span></td><td class="text-end pe-3"><a th:href="@{/usuarios/modificar/{id}(id=${usuario.idUsuario})}" class="btn btn-outline-primary btn-sm">Editar</a><a th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Eliminar usuario?');">Eliminar</a></td></tr></tbody></table></div></div>
    </main>
</body>
</html>
