<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías | PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">🐾 PetShop</a><a class="btn btn-light btn-sm" th:href="@{/productos}">Productos</a></div></nav>
    <main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="fw-bold mb-1">Categorías</h1><p class="text-secondary mb-0">Organiza los productos del catálogo.</p></div><a th:href="@{/categorias/nuevo}" class="btn btn-primary">+ Agregar categoría</a></div>
        <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3">ID</th><th>Descripción</th><th>Estado</th><th class="text-end pe-3">Acciones</th></tr></thead><tbody><tr th:each="categoria : ${categorias}"><td class="ps-3" th:text="${categoria.idCategoria}">1</td><td class="fw-semibold" th:text="${categoria.descripcion}">Categoría</td><td><span class="badge" th:classappend="${categoria.activo ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${categoria.activo ? 'Activa' : 'Inactiva'}">Activa</span></td><td class="text-end pe-3"><a th:href="@{/categorias/modificar/{id}(id=${categoria.idCategoria})}" class="btn btn-outline-primary btn-sm">Editar</a><a th:href="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Eliminar categoría?');">Eliminar</a></td></tr></tbody></table></div></div>
    </main>
</body>
</html>
