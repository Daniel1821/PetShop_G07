<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reporte de ventas | PetShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="d-flex justify-content-between"><h1>Reporte de ventas</h1><a class="btn btn-outline-primary" th:href="@{/pedidos/gestion}">Gestión de pedidos</a></div><form class="card card-body mb-4" method="get" th:action="@{/reportes/ventas}"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Desde</label><input class="form-control" type="date" name="inicio" th:value="${inicio}"></div><div class="col-md-4"><label class="form-label">Hasta</label><input class="form-control" type="date" name="fin" th:value="${fin}"></div><div class="col-md-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Filtrar</button><a class="btn btn-outline-secondary" th:href="@{/reportes/ventas}">Limpiar</a><a class="btn btn-success" th:href="@{/reportes/ventas/csv(inicio=${inicio},fin=${fin})}">CSV</a></div></div></form><div class="card shadow-sm border-0"><div class="card-body"><h2 class="h4">Total vendido: <span class="text-primary" th:text="|₡${#numbers.formatDecimal(total, 1, 2)}|">₡0</span></h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Pedido</th><th>Fecha</th><th>Estado</th><th>Total</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td th:text="|#${pedido.idPedido}|">#1</td><td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy')}">Fecha</td><td th:text="${pedido.estado}">Estado</td><td th:text="|₡${#numbers.formatDecimal(pedido.total, 1, 2)}|">₡0</td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="4" class="text-center">No hay ventas en el período seleccionado.</td></tr></tbody></table></div></div></main></body></html>
